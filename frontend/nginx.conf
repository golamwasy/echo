server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Built assets: skip the scanner rules below.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # Bots probe for PHP, WordPress, cPanel, debug pages and dotfiles like .git and .env.
    # None of that exists here, so answer 404 and keep it out of the logs.
    location ~* (\.php$|phpinfo) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* ^/(\.|wp-|wordpress|cpanel|webmail|webroot|_profiler|_environment) {
        access_log off;
        log_not_found off;
        return 404;
    }

    location = /robots.txt {
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
