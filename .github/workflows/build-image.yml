name: Build images

# Builds on GitHub's own machines and publishes to GHCR. The home server pulls the
# finished images by itself (see deploy/); nothing here can run code on the server.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/echo-backend:latest
            ghcr.io/${{ github.repository_owner }}/echo-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push the frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          push: true
          # Same value the server build used: the page calls /api on its own host.
          build-args: |
            VITE_API_URL=
          tags: |
            ghcr.io/${{ github.repository_owner }}/echo-frontend:latest
            ghcr.io/${{ github.repository_owner }}/echo-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
